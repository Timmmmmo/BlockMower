<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>草方块 BlockMower V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;user-select:none}
#wrap{position:relative;width:min(95vw,400px);background:#0d0d20;border-radius:16px;border:2px solid #1a1a4a;overflow:hidden;box-shadow:0 0 40px rgba(0,229,255,.15)}
#hud{display:flex;justify-content:space-around;padding:8px 4px;background:rgba(0,0,0,.5);border-bottom:1px solid #1a1a4a}
.hi{text-align:center;font-size:.75em}
.hi .val{color:#FFD700;font-weight:700;font-size:1.1em;display:block}
.hi .lbl{color:#555;font-size:.85em}
canvas{display:block;width:100%;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.88);z-index:20;border-radius:14px}
#overlay h1{font-size:1.8em;background:linear-gradient(135deg,#00E676,#76FF03);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
#overlay p{color:#777;font-size:.85em;text-align:center;max-width:280px;line-height:1.6;margin-bottom:6px}
#overlay .controls{background:rgba(0,0,0,.4);padding:12px 16px;border-radius:10px;margin:8px 0;text-align:left}
#overlay .controls p{font-size:.75em;color:#888;margin:4px 0;text-align:left}
.btn{padding:12px 32px;border:none;border-radius:10px;background:linear-gradient(135deg,#00E676,#69F0AE);color:#000;font-weight:700;font-size:1em;cursor:pointer}
#combo{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:1.6em;font-weight:700;color:#FFD700;text-shadow:0 0 20px #FFD700;pointer-events:none;opacity:0;transition:opacity .3s;z-index:15}
#wave-banner{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:1.4em;font-weight:700;color:#FF5722;text-align:center;pointer-events:none;opacity:0;z-index:15;text-shadow:0 0 15px currentColor}
#warning{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:.8em;color:#ff4444;opacity:0;z-index:10}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hi"><span class="val" id="hs">0</span><span class="lbl">💰得分</span></div>
    <div class="hi"><span class="val" id="hbs">0</span><span class="lbl">🏆最高</span></div>
    <div class="hi"><span class="val" id="hw">1</span><span class="lbl">⚔️波次</span></div>
    <div class="hi"><span class="val" id="hk">0</span><span class="lbl">💀击杀</span></div>
  </div>
  <canvas id="c"></canvas>
  <div id="overlay">
    <h1>🌿 草方块</h1>
    <p>真正的融合！<br>草地 = 俄罗斯方块格子<br>割草 = 消除方块！</p>
    <div class="controls">
      <p>🎮 <b>移动</b>：拖动屏幕 或 方向键</p>
      <p>🌿 <b>割草</b>：经过草地即割</p>
      <p>✨ <b>满行消除</b>：割完整行草触发！</p>
      <p>⚠️ <b>警告</b>：草长到顶 = 游戏结束</p>
    </div>
    <button class="btn" onclick="startGame()">▶ 开始</button>
  </div>
  <div id="combo"></div>
  <div id="wave-banner"></div>
  <div id="warning">⚠️ 草快到顶了！</div>
</div>

<script>
const COLS=10,ROWS=18;
const CELL=32;
const GROWTH_INTERVAL=8000;
const GRASS_GROWTH=0.02;

let canvas,ctx,gameWidth,gameHeight;

function resize(){
  canvas=document.getElementById('c');
  const wrap=document.getElementById('wrap');
  gameWidth=wrap.clientWidth;
  gameHeight=gameWidth*(ROWS/COLS);
  canvas.style.height=gameHeight+'px';
  canvas.width=COLS*CELL;
  canvas.height=ROWS*CELL;
  canvas.addEventListener('pointermove',onPointerMove);
  canvas.addEventListener('pointerdown',onPointerDown);
}

let grid,player,enemies,particles,score,highScore,kills,wave,gameState,lastTime;
let growthTimer,waveTimer,growProgress;
let isDragging=false,lastPX=-1,lastPY=-1;

function initGrid(){
  grid=[];
  for(let y=0;y<ROWS;y++){
    grid[y]=[];
    for(let x=0;x<COLS;x++){
      grid[y][x]=2;
    }
  }
}

function startGame(){
  resize();
  initGrid();
  player={x:5,y:ROWS-2,size:CELL-4};
  enemies=[];particles=[];
  score=0;kills=0;wave=1;
  highScore=parseInt(localStorage.getItem('blockmower_v4_high')||'0',10);
  growthTimer=0;waveTimer=0;growProgress=0;
  gameState='playing';
  document.getElementById('overlay').style.display='none';
  updateHUD();
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

function endGame(){
  gameState='over';
  if(score>highScore){highScore=score;localStorage.setItem('blockmower_v4_high',highScore.toString());}
  const ol=document.getElementById('overlay');
  ol.innerHTML='<h1 style="color:#ff4444">💀 游戏结束</h1><p>得分 <b style="color:#FFD700;font-size:1.5em">'+score+'</b></p><p>最高 <b>'+highScore+'</b> | 击杀 <b>'+kills+'</b> | 波次 <b>'+wave+'</b><br><br><button class="btn" onclick="startGame()">🔄 再来</button>';
  ol.style.display='flex';
}

function showCombo(text,color='#FFD700'){
  const el=document.getElementById('combo');
  el.textContent=text;el.style.color=color;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',800);
}

function showWaveBanner(text){
  const el=document.getElementById('wave-banner');
  el.textContent=text;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1500);
}

function spawnEnemy(){
  const ex=Math.floor(Math.random()*COLS);
  let ey=-1;
  for(let y=ROWS-1;y>=0;y--){if(grid[y][ex]===0){ey=y;break;}}
  if(ey<0)return;
  const hp=1+Math.floor(wave/2);
  enemies.push({x:ex,y:ey,hp,maxHp:hp,moveTimer:0,speed:Math.min(1.8,0.6+wave*0.1)});
}

function moveEnemies(dt){
  enemies.forEach(e=>{
    e.moveTimer+=dt;
    const interval=350/e.speed;
    if(e.moveTimer<interval)return;
    e.moveTimer=0;
    const dx=player.x-e.x,dy=player.y-e.y;
    const moves=[];
    if(dx!==0)moves.push({x:Math.sign(dx),y:0});
    if(dy!==0)moves.push({x:0,y:Math.sign(dy)});
    let moved=false;
    for(const m of moves){
      const nx=e.x+m.x,ny=e.y+m.y;
      if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]!==2){e.x=nx;e.y=ny;moved=true;break;}
    }
    if(!moved){
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      dirs.sort(()=>Math.random()-.5);
      for(const m of dirs){
        const nx=e.x+m.x,ny=e.y+m.y;
        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]!==2){e.x=nx;e.y=ny;break;}
      }
    }
  });
}

function checkRowClears(){
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    const mowedCount=grid[y].filter(v=>v===0).length;
    if(mowedCount>=COLS){
      spawnClearParticles(y);
      grid.splice(y,1);
      grid.unshift(new Array(COLS).fill(2));
      cleared++;y++;
      score+=500;
    }
  }
  if(cleared>0){
    showCombo((cleared>1?'🔥 '+cleared+'连消！':'✨ 单消')+' +'+(cleared*500),'#00E676');
  }
}

function spawnClearParticles(y){
  for(let x=0;x<COLS;x++){
    for(let i=0;i<4;i++){
      particles.push({x:(x+.5)*CELL,y:(y+.5)*CELL,vx:(Math.random()-.5)*6,vy:(Math.random()-1)*6,life:1,color:'#00E676',size:5+Math.random()*5});
    }
  }
}

function growGrass(dt){
  growthTimer+=dt;
  if(growthTimer>=GROWTH_INTERVAL){
    growthTimer=0;
    for(let y=0;y<ROWS-1;y++){
      for(let x=0;x<COLS;x++){
        if(grid[y][x]===2&&grid[y+1][x]===0){
          grid[y][x]=1;
        }
      }
    }
  }
  
  growProgress+=dt*GRASS_GROWTH/1000;
  const warningEl=document.getElementById('warning');
  let topGrass=0;
  for(let y=0;y<3;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]===2)topGrass++;
    }
  }
  warningEl.style.opacity=topGrass>COLS*.3?'1':'0';
}

function updateHUD(){
  document.getElementById('hs').textContent=score;
  document.getElementById('hbs').textContent=highScore||0;
  document.getElementById('hw').textContent=wave;
  document.getElementById('hk').textContent=kills;
}

function onPointerDown(e){
  isDragging=true;
  lastPX=e.clientX;lastPY=e.clientY;
}

function onPointerMove(e){
  if(!isDragging||gameState!=='playing')return;
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  const nx=Math.floor((e.clientX-rect.left)*scaleX/CELL);
  const ny=Math.floor((e.clientY-rect.top)*scaleY/CELL);
  if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]!==2){
    player.x=nx;player.y=ny;
  }
}

document.addEventListener('pointerup',()=>isDragging=false);

document.addEventListener('keydown',e=>{
  if(gameState!=='playing')return;
  let nx=player.x,ny=player.y;
  if(e.key==='ArrowLeft')nx--;
  if(e.key==='ArrowRight')nx++;
  if(e.key==='ArrowUp')ny--;
  if(e.key==='ArrowDown')ny++;
  if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&grid[ny][nx]!==2){player.x=nx;player.y=ny;}
  if(e.key===' ')e.preventDefault();
});

function update(dt){
  if(gameState!=='playing')return;
  
  if(grid[player.y][player.x]===1){
    grid[player.y][player.x]=0;
    score+=10;
  }
  
  checkRowClears();
  growGrass(dt);
  
  waveTimer+=dt;
  if(waveTimer>=20000){waveTimer=0;wave++;showWaveBanner('⚔️ 第'+wave+'波来袭！');}
  
  const spawnInterval=Math.max(1200,2500-wave*100);
  if(Math.random()<dt/spawnInterval){spawnEnemy();}
  
  moveEnemies(dt);
  
  enemies=enemies.filter(e=>{
    if(e.x===player.x&&e.y===player.y){e.hp--;if(e.hp<=0){kills++;score+=100+wave*20;return false;}}
    return true;
  });
  
  for(const e of enemies){if(e.x===player.x&&e.y===player.y){endGame();return;}}
  
  let topGrass=0;
  for(let y=0;y<2;y++){
    for(let x=0;x<COLS;x++){if(grid[y][x]===2)topGrass++;}
  }
  if(topGrass>=COLS*.7){endGame();return;}
  
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.025;return p.life>0;});
  updateHUD();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const v=grid[y][x];
      const px=x*CELL,py=y*CELL;
      if(v===0){
        ctx.fillStyle='#1a0a0a';ctx.fillRect(px,py,CELL-1,CELL-1);
      }else if(v===1){
        ctx.fillStyle='#0d2e0d';ctx.fillRect(px,py,CELL-1,CELL-1);
        ctx.fillStyle='#2E7D32';ctx.fillRect(px+6,py+CELL-10,4,8);
        ctx.fillRect(px+14,py+CELL-12,4,10);
        ctx.fillRect(px+22,py+CELL-8,4,6);
      }else if(v===2){
        const g=Math.min(1,.2+growProgress*.3);
        ctx.fillStyle=`rgb(${20-g*10},${Math.floor(50+g*20)},${20})`;
        ctx.fillRect(px,py,CELL-1,CELL-1);
        const h=8+growProgress*8;
        ctx.fillStyle='#2E7D32';ctx.fillRect(px+5,py+CELL-h,3,h);
        ctx.fillRect(px+14,py+CELL-h-2,3,h+2);
        ctx.fillRect(px+23,py+CELL-h+1,3,h-1);
      }
    }
  }
  
  const dangerZone=3;
  ctx.fillStyle='rgba(255,0,0,.15)';
  ctx.fillRect(0,0,canvas.width,dangerZone*CELL);
  ctx.strokeStyle='rgba(255,0,0,.5)';
  ctx.lineWidth=2;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(0,dangerZone*CELL);ctx.lineTo(canvas.width,dangerZone*CELL);ctx.stroke();
  ctx.setLineDash([]);
  
  enemies.forEach(e=>{
    const cx=e.x*CELL+CELL/2,cy=e.y*CELL+CELL/2,rr=CELL/2-3;
    ctx.fillStyle='#b71c1c';ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff1744';ctx.beginPath();ctx.arc(cx,cy,rr-2,0,Math.PI*2);ctx.fill();
    ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👾',cx,cy);
    if(e.maxHp>1){
      const bw=CELL-4,bh=3,bx=e.x*CELL+2,by=e.y*CELL-6;
      ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='#f44336';ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
    }
  });
  
  const px=player.x*CELL+CELL/2,py=player.y*CELL+CELL/2;
  ctx.fillStyle='#00c853';ctx.beginPath();ctx.arc(px,py,CELL/2-2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#69f0ae';ctx.beginPath();ctx.arc(px,py,CELL/2-4,0,Math.PI*2);ctx.fill();
  ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚜',px,py);
  
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});
  ctx.globalAlpha=1;
}

function loop(t){
  if(gameState!=='playing')return;
  const dt=Math.min(t-lastTime,50);lastTime=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize',()=>{if(gameState==='playing')resize();});
resize();
</script>
</body>
</html>
