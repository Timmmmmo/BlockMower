<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 2048射手 | TikTok Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* TikTok-style background effects */
        .background-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b35;
            border-radius: 50%;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            position: relative;
            border: 2px solid #ff6b35;
        }

        /* Header with TikTok-style branding */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .game-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .tiktok-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff0050, #ff4081);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Stats bar - TikTok style */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            border: 2px solid #dee2e6;
        }

        .stat-item {
            text-align: center;
            position: relative;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Enhanced grid container */
        .grid-container {
            position: relative;
            margin: 20px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border: 3px solid #ff6b35;
            border-radius: 15px;
        }

        /* Weapons section - TikTok style */
        .weapons-section {
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #fff3e0 0%, #ffeaa7 100%);
            border-radius: 15px;
            border: 2px solid #fdcb6e;
        }

        .weapons-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .weapons-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .weapon-slot {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .weapon-slot.active {
            border-color: #ff6b35;
            background: linear-gradient(135deg, #ff6b35 0%, #e5562a 100%);
            color: white;
            transform: scale(1.05);
        }

        .weapon-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .weapon-name {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

        /* Control instructions - TikTok style */
        .controls-section {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #90caf9;
        }

        .controls-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .control-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .control-key {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Start button - TikTok style */
        .start-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff0050, #ff4081);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 0, 80, 0.3);
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 80, 0.4);
        }

        .start-button:active {
            transform: translateY(0);
        }

        /* Mobile optimization */
        @media (max-width: 480px) {
            .game-container {
                margin: 10px;
                padding: 15px;
            }

            .game-title {
                font-size: 20px;
            }

            .stat-value {
                font-size: 16px;
            }

            .weapons-display {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .weapon-icon {
                font-size: 16px;
            }
        }

        /* Animation effects */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Success feedback */
        .success-feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .success-feedback.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- TikTok-style background particles -->
    <div class="background-effects" id="particles"></div>

    <div class="game-container">
        <!-- Header with TikTok branding -->
        <div class="header">
            <h1 class="game-title">⚡ 2048射手</h1>
            <p class="game-subtitle">合并数字获得武器，消灭僵尸！</p>
            <div class="tiktok-badge">🔥 热门游戏</div>
        </div>

        <!-- Stats bar -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">分数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="high-score">0</div>
                <div class="stat-label">最高分</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wave">0</div>
                <div class="stat-label">波次</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="kills">0</div>
                <div class="stat-label">击杀</div>
            </div>
        </div>

        <!-- Game area -->
        <div class="grid-container">
            <canvas id="c" width="400" height="300"></canvas>
        </div>

        <!-- Weapons section -->
        <div class="weapons-section">
            <div class="weapons-title">🔫 当前武器</div>
            <div class="weapons-display" id="weapons-display">
                <!-- Weapons will be populated by JavaScript -->
            </div>
        </div>

        <!-- Controls section -->
        <div class="controls-section">
            <div class="controls-title">🎮 操作说明</div>
            <div class="controls-grid">
                <div class="control-item">
                    <span class="control-key">← →</span>滑动合并
                </div>
                <div class="control-item">
                    <span class="control-key">↑ ↓</span>移动角色
                </div>
                <div class="control-item">
                    <span class="control-key">WASD</span>键盘控制
                </div>
                <div class="control-item">
                    <span class="control-key">空格</span>冲刺攻击
                </div>
            </div>
        </div>

        <!-- Start button -->
        <button class="start-button" onclick="startGame()">▶ 开始战斗</button>
    </div>

    <!-- Success feedback overlay -->
    <div class="success-feedback" id="success-overlay">
        🎉 太棒了！继续加油！
    </div>

    <script>
        // Game constants - optimized for mobile
        const COLS = 4, ROWS = 4, CELL = 80;
        const ZOMBIE_START_X = COLS * CELL + 20;

        // Core game state variables
        const MAX_WEAPONS_SHOWN = 3;

        let gameState = {
            grid: [],
            score: 0,
            moves: 0,
            zombiesKilled: 0,
            zombiesSpawned: 0,
            startTime: null,
            weaponLevel: 1,
            lastMergeTime: null,
            mergeCount: 0,
            totalMoves: 0,
            highScore: parseInt(localStorage.getItem('blockmower-highscore') || '0'),
            isGameActive: false
        };

        // Weapon definitions - enhanced for visual appeal
        const WEAPONS = {
            2: { icon: '🔫', color: '#8b5a2b', dmg: 10, rate: 500, name: '手枪' },
            4: { icon: '🏹', color: '#cd853f', dmg: 25, rate: 400, name: '弓箭' },
            8: { icon: '💣', color: '#ff6347', dmg: 60, rate: 600, name: '手雷' },
            16: { icon: '🔥', color: '#ff4500', dmg: 100, rate: 800, name: '火焰' },
            32: { icon: '❄️', color: '#87ceeb', dmg: 80, rate: 700, name: '冰冻' },
            64: { icon: '⚡', color: '#ffd700', dmg: 150, rate: 1000, name: '雷电' },
            128: { icon: '☠️', color: '#228b22', dmg: 200, rate: 1200, name: '毒雾' },
            256: { icon: '🌟', color: '#ffd700', dmg: 400, rate: 1500, name: '核弹' }
        };

        // Initialize game
        function initGame() {
            canvas = document.getElementById('c');
            ctx = canvas.getContext('2d');

            // Set canvas size for mobile
            canvas.width = COLS * CELL;
            canvas.height = ROWS * CELL;

            // Touch event handlers for mobile
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);

            // Keyboard controls
            document.addEventListener('keydown', handleKeyPress);

            // Initialize grid
            initGrid();
            updateWeaponsDisplay();
            updateStats();

            // Show success feedback occasionally
            setInterval(() => {
                if (Math.random() > 0.8) {
                    showSuccessFeedback();
                }
            }, 5000);
        }

        // Touch handling for mobile
        let touchStartX = 0, touchStartY = 0;

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }

        function handleTouchMove(e) {
            e.preventDefault();
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;

            // Determine swipe direction
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 30) moveTiles(1, 0); // Right
                else if (deltaX < -30) moveTiles(-1, 0); // Left
            } else {
                if (deltaY > 30) moveTiles(0, 1); // Down
                else if (deltaY < -30) moveTiles(0, -1); // Up
            }
        }

        function handleKeyPress(e) {
            switch(e.key.toLowerCase()) {
                case 'arrowleft':
                case 'a': moveTiles(-1, 0); break;
                case 'arrowright':
                case 'd': moveTiles(1, 0); break;
                case 'arrowup':
                case 'w': moveTiles(0, -1); break;
                case 'arrowdown':
                case 's': moveTiles(0, 1); break;
                case ' ': shoot(); break;
            }
        }

        // Grid management
        function initGrid() {
            gameState.grid = [];
            gameState.tiles = [];
            for (let y = 0; y < ROWS; y++) {
                gameState.grid[y] = [];
                for (let x = 0; x < COLS; x++) gameState.grid[y][x] = 0;
            }
            for (let i = 0; i < 3; i++) addRandomTile();
        }

        function addRandomTile() {
            const empty = [];
            for (let y = 0; y < ROWS; y++)
                for (let x = 0; x < COLS; x++)
                    if (gameState.grid[y][x] === 0) empty.push({ x, y });

            if (empty.length === 0) return;
            const pos = empty[Math.floor(Math.random() * empty.length)];
            const val = Math.random() < 0.9 ? 2 : 4;
            gameState.grid[pos.y][pos.x] = val;
            gameState.tiles.push({
                x: pos.x, y: pos.y, vx: 0, vy: 0, val,
                scale: 0.5, targetScale: 1
            });
        }

        // Move tiles with hardcore stats tracking
        function moveTiles(dx, dy) {
            if (dx === 0 && dy === 0) return false;

            let moved = false;
            const originalGrid = JSON.parse(JSON.stringify(gameState.grid));

            gameState.totalMoves++;

            for (let dir = 0; dir < Math.abs(dx) + Math.abs(dy); dir++) {
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (gameState.grid[y][x] === 0) continue;

                        let nx = x + dx, ny = y + dy;
                        while (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                            if (gameState.grid[ny][nx] === 0) {
                                gameState.grid[y][x] = 0;
                                gameState.grid[ny][nx] = gameState.grid[y][x];
                                moved = true;
                                x = nx; y = ny;
                                nx += dx; ny += dy;
                            } else if (gameState.grid[ny][nx] === gameState.grid[y][x]) {
                                const newVal = gameState.grid[y][x] * 2;
                                gameState.grid[y][x] = 0;
                                gameState.grid[ny][nx] = newVal;
                                gameState.score += newVal;
                                gameState.mergeCount++;
                                gameState.lastMergeTime = Date.now();
                                moved = true;
                                if (newVal > getHighestTile()) setHighestTile(newVal);
                                spawnMergeParticles(nx, ny, newVal);
                                updateWeapons();
                                updateStats();
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                }
            }

            if (moved) {
                addRandomTile();
                updateStats();
                checkHighScore();
            }

            return moved;
        }

        // Shooting mechanism
        function shoot() {
            const highestTile = getHighestTile();
            if (WEAPONS[highestTile]) {
                const weapon = WEAPONS[highestTile];
                // Create bullet effect (simplified for performance)
                createBulletEffect();
            }
        }

        function createBulletEffect() {
            // Simple bullet effect for visual feedback
            const bullet = {
                x: ZOMBIE_START_X - 20,
                y: canvas.height / 2,
                vx: -10,
                vy: 0,
                life: 50
            };
            gameState.bullets = gameState.bullets || [];
            gameState.bullets.push(bullet);
        }

        // Zombie spawning with wave system
        function spawnWave() {
            const zombieCount = Math.min(gameState.wave + 1, 10);
            for (let i = 0; i < zombieCount; i++) {
                setTimeout(() => {
                    spawnZombie();
                }, i * 1000);
            }
        }

        function spawnZombie() {
            gameState.zombiesSpawned++;
            const zombie = {
                x: ZOMBIE_START_X,
                y: Math.random() * (canvas.height - 40),
                vx: -2 - Math.random(),
                hp: 50 + Math.random() * 50
            };
            gameState.zombies = gameState.zombies || [];
            gameState.zombies.push(zombie);
        }

        // Update weapons display
        function updateWeaponsDisplay() {
            const weaponsContainer = document.getElementById('weapons-display');
            weaponsContainer.innerHTML = '';

            let sorted = Object.entries(WEAPONS).sort((a, b) => a[0] - b[0]);
            for (let i = 0; i < Math.min(sorted.length, MAX_WEAPONS_SHOWN); i++) {
                let [val, w] = sorted[i];
                if (getHighestTile() >= val) {
                    let div = document.createElement('div');
                    div.className = 'weapon-slot' + (val === getHighestTile() ? ' active' : '');
                    div.innerHTML = `<div class="weapon-icon">${w.icon}</div><div class="weapon-name">${w.name}</div>`;
                    weaponsContainer.appendChild(div);
                }
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('high-score').textContent = gameState.highScore;
            document.getElementById('wave').textContent = gameState.wave;
            document.getElementById('kills').textContent = gameState.zombiesKilled;
        }

        // Check and update high score
        function checkHighScore() {
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('blockmower-highscore', gameState.highScore.toString());
                updateStats();
                showSuccessFeedback('新纪录！');
            }
        }

        // Success feedback
        function showSuccessFeedback(message = '太棒了！继续加油！') {
            const overlay = document.getElementById('success-overlay');
            overlay.textContent = message;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 2000);
        }

        // Utility functions
        function getHighestTile() {
            return Math.max(...gameState.tiles.map(t => t.val), 2);
        }

        function setHighestTile(val) {
            gameState.highestTile = val;
        }

        function spawnMergeParticles(x, y, val) {
            // Visual particle effect for merges
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    showSuccessFeedback('+'+val);
                }, i * 100);
            }
        }

        // Background particles for TikTok aesthetic
        function createBackgroundParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize everything when page loads
        window.onload = function() {
            initGame();
            createBackgroundParticles();
        };

        // Start game function
        function startGame() {
            if (!gameState.isGameActive) {
                gameState.isGameActive = true;
                gameState.startTime = Date.now();
                gameState.score = 0;
                gameState.wave = 1;
                gameState.zombiesKilled = 0;
                gameState.zombiesSpawned = 0;
                gameState.mergeCount = 0;
                gameState.totalMoves = 0;
                gameState.highestTile = 2;
                gameState.zombies = [];
                gameState.bullets = [];

                initGrid();
                spawnWave();
                updateStats();
                updateWeaponsDisplay();
            }
        }

        // Game loop
        function gameLoop() {
            if (!gameState.isGameActive) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid background
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL, 0);
                ctx.lineTo(x * CELL, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL);
                ctx.lineTo(canvas.width, y * CELL);
                ctx.stroke();
            }

            // Draw tiles
            gameState.tiles.forEach(tile => {
                const x = tile.x * CELL + CELL/2;
                const y = tile.y * CELL + CELL/2;
                const size = CELL * tile.targetScale * 0.8;

                // Tile gradient
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size/2);
                const colors = {
                    2: ['#eee4da', '#ede0c8'],
                    4: ['#ede0c8', '#f2b179'],
                    8: ['#f2b179', '#f59563'],
                    16: ['#f59563', '#f67c5f'],
                    32: ['#f67c5f', '#f65e3b'],
                    64: ['#f65e3b', '#edcf72'],
                    128: ['#edcf72', '#edcc61'],
                    256: ['#edcc61', '#edc850'],
                    512: ['#edc850', '#edc53f'],
                    1024: ['#edc53f', '#edc22e'],
                    2048: ['#edc22e', '#3c3a32']
                };

                const tileColors = colors[tile.val] || ['#3c3a32', '#2c2a22'];
                gradient.addColorStop(0, tileColors[0]);
                gradient.addColorStop(1, tileColors[1]);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, size/2, 0, 2 * Math.PI);
                ctx.fill();

                // Tile number
                if (tile.val >= 4) {
                    ctx.fillStyle = tile.val <= 4 ? '#776e65' : '#f9f6f2';
                    ctx.font = `bold ${size/3}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(tile.val, x, y);
                }
            });

            // Draw bullets
            if (gameState.bullets) {
                gameState.bullets.forEach(bullet => {
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 4, 0, 2 * Math.PI);
                    ctx.fill();
                });
            }

            // Update and draw zombies
            if (gameState.zombies) {
                gameState.zombies.forEach(zombie => {
                    zombie.x += zombie.vx;
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(zombie.x, zombie.y, 30, 30);
                    ctx.fillStyle = '#000';
                    ctx.font = '12px Arial';
                    ctx.fillText('🧟', zombie.x + 5, zombie.y + 20);
                });
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
